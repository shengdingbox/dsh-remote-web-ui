# The standalone workspace's own bundle layer.
#
# Needed because DSH judges installability from `dsh.bundle.patch` in the
# package.json at the path or git ref you install: a repository root without
# it is refused as `not-a-bundle` ("this package declares no bundle"). The row
# below mounts the package through the ROOT identity, whose `main`/`exports`
# forward to `packages/dsh-remote-web-ui/lib/*`, so a root install (path link
# or `github:` ref) runs the code in this checkout.
#
# The row id matches the package's own `remote-web-ui` row on purpose: a
# profile's patch layer addresses config by id, so both install paths must
# present the same row or the user's settings silently stop applying. The cost
# is that one profile may carry only ONE of the two — the root entry here or
# `packages/dsh-remote-web-ui` — never both, since two bundles claiming one row
# is a conflict.
- insert:
    - id: remote-web-ui
      name: '@shengdingbot/dsh-remote-web-ui-standalone'
